[project]
name = "thai-audio-jepa-asr"
version = "0.1.0"
description = "Thai Automatic Speech Recognition using Audio-JEPA and CTC"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "av>=19.0.1",
    "datasets>=5.0.1",
    "dulwich>=1.2.17",
    "huggingface-hub>=1.33.0",
    "jiwer>=4.0.0",
    "numpy>=2.5.3",
    "pytest>=9.1.1",
    "pythainlp>=5.3.8",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
    "tabulate>=0.10.0",
    "tensorboard>=2.21.0",
    "torch>=2.14.1",
    "torchaudio>=2.11.0",
    "tqdm>=4.70.1",
]

[project.scripts]
thai-audio-jepa-asr = "thai_audio_jepa_asr:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
