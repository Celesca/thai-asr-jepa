experiment:
  name: "smoke_ssl"
  seed: 42
  output_dir: "outputs/runs/smoke_ssl"

data:
  manifest_dir: "data_cache/porjai/manifests"
  manifest_path: "data_cache/porjai/manifests/smoke_train.jsonl"
  sample_rate: 32000
  clip_length_s: 10.0
  target_time_bins: 256

model:
  type: "audio_jepa_ssl"
  pretrained_checkpoint: "ltuncay/Audio-JEPA"
  patch_size:
    time: 1
    frequency: 16
  masking_mode: "temporal"
  predictor_depth: 2
  predictor_embed_dim: 384
  ema_tau: 0.996
  norm_pix_loss: true
  enc_mask_scale: [0.2, 0.7]
  pred_mask_scale: [0.1, 0.25]

training:
  epochs: 1
  batch_size: 2
  lr: 1.0e-4
  weight_decay: 1.0e-2
  warmup_ratio: 0.1
  grad_clip_norm: 1.0
  log_interval: 1
  device: "cuda"
  num_workers: 0
