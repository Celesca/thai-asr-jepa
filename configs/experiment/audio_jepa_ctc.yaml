experiment:
  name: "audio_jepa_ctc_baseline"
  seed: 42
  output_dir: "outputs/runs/audio_jepa_ctc"

data:
  manifest_dir: "data_cache/porjai/manifests"
  vocab_path: "data_cache/porjai/vocab.json"
  sample_rate: 32000
  clip_length_s: 10.0
  target_time_bins: 256
  budget_ratio: 1.0

model:
  type: "audio_jepa"
  pretrained_checkpoint: "ltuncay/Audio-JEPA"
  embed_dim: 768
  depth: 12
  num_heads: 12
  temporal_adapter_mode: "upsample_conv"
  upsample_factor: 8
  freeze_encoder: false
  unfreeze_last_n_blocks: null
  head_dropout: 0.1

training:
  epochs: 10
  batch_size: 8
  encoder_lr: 5.0e-5
  head_lr: 3.0e-4
  weight_decay: 1.0e-2
  warmup_ratio: 0.1
  grad_clip_norm: 1.0
  log_interval: 10
  eval_interval: 1
  early_stopping_patience: 5
  device: "cuda"
  num_workers: 2
