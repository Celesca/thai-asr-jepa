experiment:
  name: "audio_jepa_thai_ssl"
  seed: 42
  output_dir: "outputs/runs/audio_jepa_thai_ssl"

data:
  manifest_dir: "data_cache/porjai/manifests"
  sample_rate: 32000
  clip_length_s: 10.0
  target_time_bins: 256

model:
  type: "audio_jepa_ssl"
  pretrained_checkpoint: "ltuncay/Audio-JEPA"
  predictor_depth: 6
  predictor_embed_dim: 384
  ema_tau: 0.996
  norm_pix_loss: true
  enc_mask_scale: [0.2, 0.8]
  pred_mask_scale: [0.15, 0.3]

training:
  epochs: 5
  batch_size: 8
  lr: 1.0e-4
  weight_decay: 1.0e-2
  warmup_ratio: 0.1
  grad_clip_norm: 1.0
  log_interval: 10
  device: "cuda"
  num_workers: 2
