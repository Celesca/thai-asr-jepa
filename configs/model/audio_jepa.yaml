# Configuration B: Modified Audio-JEPA with asymmetric (1, 16) patching (ASR fine temporal resolution)
model:
  type: "audio_jepa"
  pretrained_checkpoint: "ltuncay/Audio-JEPA"
  checkpoint_filename: "JEPA.ckpt"
  embed_dim: 768
  depth: 12
  num_heads: 12
  mlp_ratio: 4.0
  patch_size:
    time: 1
    frequency: 16
  temporal_adapter_mode: "native_pooling"
  upsample_factor: 1
  freeze_encoder: false
  unfreeze_last_n_blocks: null
  head_dropout: 0.1
