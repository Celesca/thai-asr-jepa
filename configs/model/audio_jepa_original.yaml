# Configuration A: Original Audio-JEPA with coarse (16, 16) patching (Diagnostic baseline)
model:
  type: "audio_jepa"
  pretrained_checkpoint: "ltuncay/Audio-JEPA"
  checkpoint_filename: "JEPA.ckpt"
  embed_dim: 768
  depth: 12
  num_heads: 12
  mlp_ratio: 4.0
  patch_size:
    time: 16
    frequency: 16
  temporal_adapter_mode: "unmodified"
  upsample_factor: 1
  freeze_encoder: false
  unfreeze_last_n_blocks: null
  head_dropout: 0.1
