# Configuration C: Modified Audio-JEPA with Thai SSL Continued Pretraining
model:
  type: "audio_jepa"
  pretrained_checkpoint: "ltuncay/Audio-JEPA"
  adapted_checkpoint: "outputs/runs/audio_jepa_thai_ssl/checkpoints/adapted_encoder.pt"
  embed_dim: 768
  depth: 12
  num_heads: 12
  mlp_ratio: 4.0
  patch_size:
    time: 1
    frequency: 16
  temporal_adapter_mode: "native_pooling"
  upsample_factor: 1
  freeze_encoder: false
  unfreeze_last_n_blocks: null
  head_dropout: 0.1
